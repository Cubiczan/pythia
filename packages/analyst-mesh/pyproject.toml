[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pythia-analyst-mesh"
version = "0.1.0"
description = "Specialist LLM analyst agents for the Pythia Delphi trading mesh."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "icohangar-ops / Impactquadrant" },
]
keywords = ["delphi", "gensyn", "prediction-markets", "llm", "agents", "ensemble"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "openai>=1.0",
    "anthropic>=0.20",
    "tenacity>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]

[project.scripts]
pythia-analyst = "pythia_analyst_mesh.cli:main"

[project.urls]
Homepage = "https://github.com/icohangar-ops/pythia"
Documentation = "https://github.com/icohangar-ops/pythia/blob/main/docs/ARCHITECTURE.md"
Repository = "https://github.com/icohangar-ops/pythia"
Issues = "https://github.com/icohangar-ops/pythia/issues"

[tool.hatchling.build]
packages = ["src/pythia_analyst_mesh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
