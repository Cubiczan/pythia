[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pythia-forge"
version = "0.1.0"
description = "Backtest harness + CI deploy pipeline for the Pythia mesh — replays resolved Delphi markets through the full mesh → consensus → risk stack to validate strategy and tune analyst weights. Wraps icohangar-ops/forge."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "icohangar-ops / Impactquadrant", email = "ops@icohangar.dev" },
]
keywords = [
    "pythia",
    "delphi",
    "backtest",
    "prediction-market",
    "forge",
    "ci",
    "multi-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "tomli>=2.0; python_version < '3.11'",
    "pythia-delphi-adapter",
    "pythia-analyst-mesh",
    "pythia-consensus",
    "pythia-risk",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
pythia-forge = "pythia_forge.cli:main"

[project.urls]
Homepage = "https://github.com/icohangar-ops/pythia"
Documentation = "https://github.com/icohangar-ops/pythia/blob/main/docs/ARCHITECTURE.md"
Repository = "https://github.com/icohangar-ops/pythia"
Issues = "https://github.com/icohangar-ops/pythia/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pythia_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
