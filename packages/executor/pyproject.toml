[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pythia-executor"
version = "0.1.0"
description = "Pythia trade-orchestration CLI — wraps icohangar-ops/metabocommand to run the full mesh → consensus → risk → ATT pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "icohangar-ops / Impactquadrant" },
]
keywords = [
    "delphi",
    "gensyn",
    "prediction-market",
    "trading",
    "multi-agent",
    "llm",
    "metabocommand",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "tomli>=2.0; python_version < '3.11'",
    "pythia-delphi-adapter",
    "pythia-analyst-mesh",
    "pythia-consensus",
    "pythia-risk",
]

[project.scripts]
pythia = "pythia_executor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/icohangar-ops/pythia"
Documentation = "https://github.com/icohangar-ops/pythia/blob/main/docs/ARCHITECTURE.md"
Repository = "https://github.com/icohangar-ops/pythia"
Issues = "https://github.com/icohangar-ops/pythia/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pythia_executor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]  # line length handled by formatter
