[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pythia-delphi-adapter"
version = "0.1.0"
description = "Gensyn Delphi ATT integration for Pythia"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "icohangar-ops / Impactquadrant" },
]
keywords = ["gensyn", "delphi", "att", "prediction-markets", "pythia"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Framework :: AsyncIO",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "tenacity>=8.0",
    "websockets>=12.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pythia-delphi = "pythia_delphi_adapter.cli:main"

[project.urls]
Homepage = "https://github.com/icohangar-ops/pythia"
Documentation = "https://github.com/icohangar-ops/pythia/blob/main/docs/ARCHITECTURE.md"
Repository = "https://github.com/icohangar-ops/pythia"
Issues = "https://github.com/icohangar-ops/pythia/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pythia_delphi_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
