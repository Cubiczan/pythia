[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pythia-consensus"
version = "0.1.0"
description = "Delphi-specific consensus + audit layer that wraps icohangar-ops/consensus-hardening-protocol for the Pythia mesh."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "icohangar-ops / Impactquadrant", email = "ops@icohangar.dev" },
]
keywords = ["pythia", "delphi", "consensus", "multi-agent", "prediction-market"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
pythia-consensus = "pythia_consensus.cli:main"

[project.urls]
Homepage = "https://github.com/icohangar-ops/pythia"
Documentation = "https://github.com/icohangar-ops/pythia/blob/main/docs/ARCHITECTURE.md"
Repository = "https://github.com/icohangar-ops/pythia"
Issues = "https://github.com/icohangar-ops/pythia/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pythia_consensus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
